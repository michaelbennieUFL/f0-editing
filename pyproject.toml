[project]
name = "dichotic-praat-editor"
version = "0.2.0"
description = "Two-channel Praat overlap-add F0 editor with dichotic playback"
requires-python = ">=3.10,<3.14"
dependencies = [
    "numpy>=1.26,<3",
    "praat-parselmouth>=0.4.6,<0.6",
    "PyQt6>=6.6,<7",
    "sounddevice>=0.5,<1",
    "soundfile>=0.12,<1",
]

[project.optional-dependencies]
pitchflower = [
    "pitchflower>=0.1.0",
    "huggingface-hub>=0.24",
    "scipy>=1.11",
    # pyworld 0.3.5 imports the legacy pkg_resources module, removed by
    # setuptools 82. Keep the neural extra compatible until pyworld updates.
    "setuptools<81",
]
promonet = [
    "promonet",
    "pyworld>=0.3.5",
    "setuptools<81",
]

[project.scripts]
dichotic-praat-editor = "dichotic_editor:main"
dichotic-editor = "dichotic_editor:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["dichotic_editor", "praat_backend", "render_cli"]

[tool.setuptools.packages.find]
include = ["dichotic*"]

[tool.uv.sources]
pitchflower = { path = "external/PitchFlower", editable = true }
promonet = { git = "https://github.com/maxrmorrison/promonet", rev = "86b815e8511d526da42cd8333a9f5a2872b11981" }
penn = { git = "https://github.com/interactiveaudiolab/penn", branch = "dev" }
torbi = { git = "https://github.com/maxrmorrison/torbi" }

[tool.pytest.ini_options]
testpaths = ["tests"]
